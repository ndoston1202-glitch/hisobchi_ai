name: Fonar APK

on:
  push:
    paths:
      - 'fonar/**'
      - '.github/workflows/build-fonar-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fonar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Paketlar
        run: flutter pub get

      - name: Analiz
        run: flutter analyze

      - name: Testlar
        run: flutter test test

      - name: APK qurish
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fonar-apk
          path: fonar/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
